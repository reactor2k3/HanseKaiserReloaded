<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Favicon von HanseReloaded: Kogge mit rot-weißem Lübecker Segel auf dunklem Siegel mit Goldrand -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4dc8c"/><stop offset=".55" stop-color="#d9ac45"/><stop offset="1" stop-color="#9a7228"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="12" fill="#2b2118"/>
  <rect x="4.5" y="4.5" width="55" height="55" rx="10" fill="none" stroke="#b08a3e" stroke-width="2"/>
  <!-- Mast mit Wimpel -->
  <path d="M32 10V44" stroke="url(#g)" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M33 10L42 12.5L33 15Z" fill="#a3262b"/>
  <!-- Rahsegel: obere Hälfte weiß, untere rot (Lübecker Farben), leicht gebläht -->
  <path d="M19 17Q32 14 45 17Q47 25 45 33Q32 30 19 33Q17 25 19 17Z" fill="#f6eedb" stroke="#6b4e1c" stroke-width="1.4"/>
  <path d="M18.4 25Q32 22.5 45.6 25Q46.3 29 45 33Q32 30 19 33Q17.7 29 18.4 25Z" fill="#a3262b"/>
  <!-- Rumpf der Kogge mit Achter- und Vorderkastell -->
  <path d="M9 40H55L50 50Q32 54 14 50Z" fill="url(#g)" stroke="#6b4e1c" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M10 40V35H18V40M46 40V36H54V40" fill="url(#g)" stroke="#6b4e1c" stroke-width="1.4" stroke-linejoin="round"/>
  <!-- Wellen -->
  <path d="M8 55Q12 52.5 16 55T24 55T32 55T40 55T48 55T56 55" fill="none" stroke="#7f9db3" stroke-width="1.6" stroke-linecap="round"/>
</svg>
